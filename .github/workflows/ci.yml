name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # turbo needs the previous commit to compute --filter=...[HEAD^]

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test build --filter=...[HEAD^]

      # Covers features/**/*.ts (root tsconfig.json) — the workspace packages'
      # own `tsc -b` above doesn't include this tree.
      - run: pnpm exec tsc --noEmit -p tsconfig.json

      # DATABASE_URL/APP_DATABASE_URL must be configured as repo secrets
      # (see env.example) — today every run shares the one provisioned Neon
      # branch (ADR-ZS-103's per-PR/per-BDD-run branching isn't wired up
      # yet), so this step is skipped rather than failing red until they are.
      - if: ${{ secrets.DATABASE_URL != '' && secrets.APP_DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
        run: |
          pnpm --filter @zschool/db run migrate
          pnpm run test:bdd
