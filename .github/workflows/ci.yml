name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # `secrets` isn't a recognized named-value inside a step's `if:` —
    # GitHub rejects the whole workflow file at parse time if you try
    # (confirmed: every run since this pattern was introduced failed
    # instantly with zero jobs, "Unrecognized named-value: 'secrets'").
    # Exposing these as job-level env vars makes them readable from `env.*`
    # in a step's `if:`, which is allowed; GitHub's log redaction still
    # applies regardless of which context carries the secret's value.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # turbo needs the previous commit to compute --filter=...[HEAD^]

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test build --filter=...[HEAD^]

      # Covers features/**/*.ts (root tsconfig.json) — the workspace packages'
      # own `tsc -b` above doesn't include this tree.
      - run: pnpm exec tsc --noEmit -p tsconfig.json

      # No secrets needed: the bdd project stands up its own disposable
      # Postgres via testcontainers (issue #35, ADR-ZS-115) — runs
      # unconditionally on every PR now, unlike the Neon-branch-gated step
      # this replaced. ubuntu-latest ships Docker preinstalled.
      - run: pnpm run test:bdd

      # RlsPolicy.test.ts is the deliberate exception (issue #35): it verifies
      # a Neon control-plane-specific behavior (migration 0007's
      # neon_superuser/BYPASSRLS fix) that a vanilla Postgres container can't
      # reproduce, so it alone still needs a real Neon branch and stays
      # gated on DATABASE_URL/APP_DATABASE_URL being configured as repo
      # secrets (see env.example).
      - if: ${{ env.DATABASE_URL != '' && env.APP_DATABASE_URL != '' }}
        run: |
          pnpm --filter @zschool/db run migrate
          pnpm --filter @zschool/db run test:rls
